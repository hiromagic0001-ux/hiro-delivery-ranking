name: Update official cast photos
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_cast_photos.mjs"
      - ".github/workflows/update-cast-photos.yml"
jobs:
  update-photos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/update_cast_photos.mjs
      - name: Commit updated photo index
        run: |
          if ! git diff --quiet -- cast-photos.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cast-photos.json
            git commit -m "Update official cast photo URLs"
            git push
          fi
